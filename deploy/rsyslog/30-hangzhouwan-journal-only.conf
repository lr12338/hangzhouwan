# Hangzhouwan services already write to journald.  Stop rsyslog from writing a
# second copy to syslog; kernel and system messages remain unaffected.
if ($programname == "hangzhouwan-video") then stop
if ($programname == "hangzhouwan-business") then stop
if ($programname == "hangzhouwan-monitor") then stop
if ($programname == "hangzhouwan-maintenance") then stop
