# 优化后的 Nginx RTMP 配置
# 专为低延迟视频流优化

worker_processes auto;  # 自动检测CPU核心数
worker_rlimit_nofile 65535;

# 错误日志
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 4096;  # 增加连接数
    # use epoll;  # Windows不支持epoll，将自动选择最佳事件模型
    multi_accept on;  # 允许一次接受多个连接
}

# RTMP 模块配置
rtmp {
    server {
        listen 1935;
        chunk_size 4096;  # 优化块大小
        
        # 设置缓冲区
        max_streams 32;
        ack_window 5000000;
        
        # 主直播应用
        application HangZhouBridge {
            live on;
            
            # 缓冲优化
            interleave on;
            wait_key on;
            wait_video on;
            
            # 发布控制
            allow publish all;  # 生产环境建议限制IP
            allow play all;
            
            # 空闲超时
            idle_streams off;
            drop_idle_publisher 10s;
            
            # 同步优化
            sync 10ms;
            
            # HLS 输出（可选）
            hls on;
            hls_path temp/hls;
            hls_fragment 2s;  # 减少片段时长
            hls_playlist_length 6s;  # 减少播放列表长度
            hls_continuous on;
            hls_cleanup on;
            hls_nested on;
            hls_fragment_naming system;
            
            # 低延迟设置
            play_time_fix on;
            publish_time_fix on;
        }
        
        # 备用应用
        application live {
            live on;
            interleave on;
            wait_key on;
            sync 10ms;
        }
    }
}

# HTTP 模块配置
http {
    include mime.types;
    default_type application/octet-stream;
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';
    
    # 访问日志
    access_log logs/access.log main;
    
    # 基础优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # 缓冲区设置
    client_body_buffer_size 128k;
    client_max_body_size 100m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # 主服务器配置
    server {
        listen 80;
        server_name localhost;
        
        # 根目录
        location / {
            root html;
            index index.html index.htm;
            
            # CORS 头部
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        }
        
        # HLS 流服务
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            alias temp/hls;
            expires -1;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            
            # 优化头部
            add_header X-Frame-Options SAMEORIGIN;
            add_header X-Content-Type-Options nosniff;
        }
        
        # RTMP 统计
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            
            # 访问控制
            allow 127.0.0.1;
            allow 192.168.0.0/16;
            deny all;
        }
        
        location /stat.xsl {
            root nginx-rtmp-module;
        }
        
        # 控制接口
        location /control {
            rtmp_control all;
            
            # 访问控制
            allow 127.0.0.1;
            allow 192.168.0.0/16;
            deny all;
        }
        
        # 错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
    
    # HTTPS 服务器（可选）
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost;
    #     
    #     ssl_certificate cert.pem;
    #     ssl_certificate_key cert.key;
    #     ssl_session_cache shared:SSL:1m;
    #     ssl_session_timeout 5m;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     
    #     location / {
    #         root html;
    #         index index.html index.htm;
    #     }
    # }
}
