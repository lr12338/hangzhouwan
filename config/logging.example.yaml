# 日志示例配置（中文运维日志）
# 真实配置：/data/hangzhouwan/config/logging.yaml（权限 600）

version: 1
disable_existing_loggers: false
formatters:
  zh:
    format: "%(asctime)s | %(levelname)s | %(module)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    formatter: zh
    level: INFO
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: zh
    level: INFO
    filename: logs/hangzhouwan.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
loggers:
  hangzhouwan:
    level: INFO
    handlers: [console, file]
    propagate: false
root:
  level: WARNING
  handlers: [console]
